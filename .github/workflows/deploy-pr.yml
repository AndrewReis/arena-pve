name: Deploy PR preview

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-existing-lambda
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  LAMBDA_FUNCTION_ARN: ${{ vars.LAMBDA_FUNCTION_ARN }}

jobs:
  deploy:
    name: Build, test and deploy
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-pr-${{ github.event.pull_request.number }}

      - name: Prepare Lambda package
        run: |
          npm prune --omit=dev
          zip -qr lambda.zip dist public node_modules package.json

      - name: Deploy existing Lambda
        run: >-
          aws lambda update-function-code
          --function-name "$LAMBDA_FUNCTION_ARN"
          --zip-file fileb://lambda.zip

      - name: Wait for Lambda update
        run: aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION_ARN"
